name = "SimCore"
uuid = "0c356fe6-1c88-4cf8-b16c-a521627c3420"
version = "1.0.0-DEV"
authors = ["Sourabh Kotnala <sauravkotnala@gmail.com>"]

[deps]
DataStructures = "864edb3b-99cc-5e75-8d2d-829cb0a9cfe8"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"

# ── GPU extension (optional) ──────────────────────────────────────────────────
# SimCoreGPUExt is auto-loaded when BOTH CUDA and KernelAbstractions are present.
# SimCore itself never depends on them — CPU-only machines are unaffected.
[weakdeps]
CUDA              = "052768ef-5323-5732-b1bb-66c8b64840ba"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"

[extensions]
SimCoreGPUExt = ["CUDA", "KernelAbstractions"]

[compat]
CUDA              = "4, 5, 6"
DataStructures    = "0.18, 0.19"
KernelAbstractions = "0.9"
StaticArrays      = "1"
julia             = "1.10"

[extras]
Aqua               = "4c88cf16-eb10-579e-8560-4a9242c79595"
CUDA               = "052768ef-5323-5732-b1bb-66c8b64840ba"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
Random             = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test               = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Aqua", "CUDA", "KernelAbstractions", "Random", "Test"]
